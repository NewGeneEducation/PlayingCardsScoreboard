<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Players | Rummy Elite</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="players">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="icon.svg" alt="Rummy Elite logo" />
          <span>Rummy Elite</span>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="scoreboard.html" class="nav-link">Scoreboard</a>
          <a href="players.html" class="nav-link active">Players</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>

        <button id="installBtn" class="btn btn-primary hidden" type="button">Install App</button>
      </header>

      <main class="container">
        <section class="panel">
          <div class="section-header">
            <h1>Players</h1>
          </div>

          <form id="addPlayerForm" class="inline-form">
            <label class="input-label" for="playerName">New player</label>
            <input id="playerName" name="playerName" type="text" maxlength="24" placeholder="Enter player name" required />
            <button type="submit" class="btn btn-primary">Add player</button>
          </form>

          <div id="playersList" class="players-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
