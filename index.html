<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Rummy Elite Scoreboard - a mobile-ready multi-page PWA" />
    <title>Rummy Elite Scoreboard</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="dashboard">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Rummy Elite home">
          <img src="icon.svg" alt="Rummy Elite logo" />
          <span>Rummy Elite</span>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <a href="index.html" class="nav-link active">Home</a>
          <a href="scoreboard.html" class="nav-link">Scoreboard</a>
          <a href="players.html" class="nav-link">Players</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>

        <button id="installBtn" class="btn btn-primary hidden" type="button">Install App</button>
      </header>

      <main class="container">
        <section class="hero panel">
          <div>
            <p class="eyebrow">Game management</p>
            <h1>Scoreboard dashboard</h1>
            <p class="lead">Track matches, manage players, and keep each round under control.</p>
          </div>
          <div class="hero-actions">
            <a class="btn btn-primary" href="scoreboard.html">Open scoreboard</a>
            <a class="btn btn-secondary" href="players.html">Manage players</a>
          </div>
        </section>

        <section class="stats-grid" aria-label="Score overview">
          <article class="stat-card panel">
            <p class="stat-label">Players</p>
            <h2 id="summaryPlayers">0</h2>
          </article>
          <article class="stat-card panel">
            <p class="stat-label">Current leader</p>
            <h2 id="summaryLeader">–</h2>
          </article>
          <article class="stat-card panel">
            <p class="stat-label">Rounds tracked</p>
            <h2 id="summaryRounds">0</h2>
          </article>
          <article class="stat-card panel">
            <p class="stat-label">Theme</p>
            <h2 id="summaryTheme">Dark</h2>
          </article>
        </section>

        <section class="content-grid">
          <article class="panel">
            <div class="section-header">
              <h2>Leaderboard</h2>
            </div>
            <div id="leaderboardList" class="list-stack"></div>
          </article>

          <article class="panel">
            <div class="section-header">
              <h2>Recent rounds</h2>
            </div>
            <div id="recentRounds" class="list-stack"></div>
          </article>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
